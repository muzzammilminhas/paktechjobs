name: Daily job scrape

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paktechjobs-daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Scrape and normalize jobs
        run: python scraper/main.py

      - name: Commit updated datasets
        run: |
          git config user.name "paktechjobs-bot"
          git config user.email "paktechjobs-bot@users.noreply.github.com"
          git add scraper/data/jobs_raw.json public/data/jobs.json public/data/history
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh daily job listings"
            git push
          fi

      - name: Trigger Vercel redeploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; skipping redeploy hook."
          fi
